name: Update legal data

on:
  schedule:
    - cron: '17 2 * * *'
    - cron: '37 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-legal-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - if: github.event_name == 'workflow_dispatch' || github.event.schedule == '37 3 * * 0'
        run: uv run --locked --python 3.12 scripts/update_data.py
      - if: github.event_name == 'workflow_dispatch' || github.event.schedule == '37 3 * * 0'
        run: uv run --locked --python 3.12 scripts/generate_versions.py --git
      - run: uv run --locked --python 3.12 scripts/refresh_current.py
      - run: uv run --locked --python 3.12 -m unittest discover -s tests
      - run: uv run --locked --python 3.12 scripts/validate_recent.py
      - run: uv run --locked --python 3.12 scripts/benchmark_data.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: grundlagsmonitor-site
          path: frontend/dist
      - name: Commit changed snapshot
        run: |
          git config user.name "grundlagsmonitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data DATA_BENCHMARK.md VERSIONING_REPORT.md frontend/public/versions frontend/public/DATA_BENCHMARK.md frontend/public/VERSIONING_REPORT.md
          git diff --cached --quiet || git commit -m "chore: update legal data"
          git push
