name: Update legal data

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - run: uv run --with certifi --python 3.12 scripts/update_data.py
      - name: Commit changed snapshot
        run: |
          git config user.name "grundlagsmonitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/changes.json
          git diff --cached --quiet || git commit -m "chore: update legal data"
          git push
