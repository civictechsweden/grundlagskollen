name: Update legal data

on:
  schedule:
    - cron: '17 22 * * *'
      timezone: 'Europe/Stockholm'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-legal-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          prune-cache: true
      - name: Set up Python
        run: uv python install
      - run: uv run --locked scripts/refresh_current.py
      - run: uv run --locked -m unittest discover -s tests
      - run: uv run --locked scripts/validate_recent.py
      - run: uv run --locked scripts/benchmark_data.py
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v7
        with:
          name: grundlagskollen-site
          path: frontend/dist
      - name: Commit changed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data DATA_BENCHMARK.md VERSIONING_REPORT.md frontend/public/versions frontend/public/DATA_BENCHMARK.md frontend/public/VERSIONING_REPORT.md
          git diff --cached --quiet || git commit -m "chore: update legal data"
          git push
